name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    name: בדיקת טיפוסים, בדיקות ובנייה
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: התקנת תלויות
        run: npm ci

      - name: בדיקת טיפוסים
        run: npm run typecheck

      - name: בדיקות
        run: npm test

      - name: בנייה לייצור
        run: npm run build
